name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q JarvisAcess-site.zip && unzip -q site/JarvisAcess-projeto.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: cd JarvisAcess && gradle assembleDebug --no-daemon
      - run: cp JarvisAcess/app/build/outputs/apk/debug/app-debug.apk JarvisAcess.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1
          name: Jarvis Acess
          files: JarvisAcess.apk
